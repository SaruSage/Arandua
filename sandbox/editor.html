<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor Livre | Arandua</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/editor.css">
  </head>
  <body class="editor-page">
    <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>
    <div class="editor-layout">
      <header class="editor-toolbar">
        <h1>Editor Livre</h1>
        <div class="editor-toolbar__acoes">
          <p class="editor-toolbar__dica">Ctrl+Z desfaz · Delete remove · Clique em pino para conectar</p>
          <a class="btn btn--ghost btn--sm" href="../index.html" aria-label="Voltar para o início"><span aria-hidden="true">←</span><span class="editor-toolbar__texto"> Voltar</span></a>
        </div>
      </header>
      <aside id="paleta" class="editor-paleta" aria-label="Paleta de componentes"></aside>
      <main class="editor-canvas" id="conteudo" tabindex="-1" aria-label="Área de montagem do circuito">
        <canvas id="canvas" aria-label="Canvas do circuito"></canvas>
      </main>
      <aside class="editor-propriedades" id="propriedades" aria-label="Propriedades do componente"></aside>
    </div>
    <script type="module">
      import { inicializarEditor } from '../assets/js/editor/editor.js';
      import { criarPainelPropriedades } from '../assets/js/editor/properties.js';

      const editor = inicializarEditor({
        canvas: document.getElementById('canvas'),
        paleta: document.getElementById('paleta'),
      });
      const painel = criarPainelPropriedades(
        document.getElementById('propriedades'),
        editor,
      );
      editor.configurarPainel(painel);
      window.arandua = { editor };
    </script>
  </body>
</html>
